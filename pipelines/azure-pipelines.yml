trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  imageName: payment-service

stages:

- stage: Build_Test
  displayName: Build and Test

  jobs:
  - job: MavenBuild
    displayName: Maven Build and Unit Tests

    steps:
    - task: Maven@4
      displayName: Maven Build and Unit Tests
      inputs:
        mavenPomFile: 'application/payment-service/pom.xml'
        goals: 'clean package'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.17'

    - task: PublishBuildArtifacts@1
      displayName: Publish JAR Artifact
      inputs:
        PathtoPublish: 'application/payment-service/target/payment-service-1.0.0.jar'
        ArtifactName: 'payment-service-jar'
        publishLocation: 'Container'


- stage: Docker_Build
  displayName: Docker Build and Security Scan
  dependsOn: Build_Test

  jobs:
  - job: DockerBuild
    displayName: Docker Build

    steps:
    - task: DownloadBuildArtifacts@1
      displayName: Download JAR Artifact
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'payment-service-jar'
        downloadPath: '$(Build.SourcesDirectory)/application/payment-service'

    - script: |
        mkdir -p application/payment-service/target
        cp application/payment-service/payment-service-1.0.0.jar application/payment-service/target/payment-service-1.0.0.jar
      displayName: Restore JAR to Docker Build Context

    - script: |
        find application/payment-service -type f
      displayName: Verify Downloaded JAR

    - script: |
        docker build -t $(imageName):$(Build.BuildId) application/payment-service
      displayName: Build Docker Image

    - script: |
        docker images $(imageName):$(Build.BuildId)
      displayName: Verify Docker Image

    - script: |
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:latest \
          image \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 0 \
          $(imageName):$(Build.BuildId)
      displayName: Trivy Security Scan

    - task: PublishBuildArtifacts@1
      displayName: Publish Kubernetes Manifests
      inputs:
        PathtoPublish: 'k8s'
        ArtifactName: 'k8s-manifests'
        publishLocation: 'Container'